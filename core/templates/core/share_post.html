<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Post - Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #262626;
        }

        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #dbdbdb;
            padding: 0 20px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .logo {
            font-size: 24px;
            font-weight: bold;
            color: #262626;
        }

        .navbar .back-btn {
            font-size: 24px;
            color: #262626;
            text-decoration: none;
        }

        .share-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }

        .post-preview {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .post-preview img {
            width: 100%;
            display: block;
        }

        .post-preview .caption {
            padding: 12px 16px;
            font-size: 14px;
        }

        .share-form {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 20px;
        }

        .share-form h3 {
            margin-bottom: 16px;
            font-size: 16px;
            font-weight: 600;
        }

        .recipient-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 16px;
            background-color: #fafafa;
        }

        .share-btn {
            background-color: #0095f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn:hover {
            background-color: #007acc;
        }

        .no-followers {
            text-align: center;
            color: #8e8e8e;
            font-size: 16px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'feed' %}" class="back-btn">←</a>
        <div class="logo">Instagram</div>
        <div></div>
    </nav>

    <div class="share-container">
        <div class="post-preview">
            {% if post.image %}
            <img src="{{ post.image.url }}" alt="Post">
            {% endif %}
            {% if post.caption %}
            <div class="caption">
                <strong>{{ post.user.username }}</strong> {{ post.caption }}
            </div>
            {% endif %}
        </div>

        <form method="post" class="share-form">
            {% csrf_token %}
            <h3>Share post with...</h3>
            {% if recipients %}
            <select name="recipient" class="recipient-select" required>
                <option value="">Select a follower</option>
                {% for user in recipients %}
                <option value="{{ user.id }}">{{ user.username }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="share-btn">Send</button>
            {% else %}
            <div class="no-followers">You need to follow some users first to share posts.</div>
            {% endif %}
        </form>
    </div>
</body>
</html>
