<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Posts - Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #262626;
        }

        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #dbdbdb;
            padding: 0 20px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .logo {
            font-size: 24px;
            font-weight: bold;
            color: #262626;
        }

        .navbar .back-btn {
            font-size: 24px;
            color: #262626;
            text-decoration: none;
        }

        .profile-header {
            max-width: 935px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .profile-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #dbdbdb;
            margin-right: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #8e8e8e;
            overflow: hidden;
        }

        .profile-details {
            flex: 1;
        }

        .profile-username {
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 20px;
        }

        .posts-section {
            max-width: 935px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            margin-top: 30px;
        }

        .post-item {
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
        }

        .post-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-posts {
            text-align: center;
            color: #8e8e8e;
            font-size: 18px;
            margin-top: 50px;
        }

        @media (max-width: 768px) {
            .profile-info {
                flex-direction: column;
                text-align: center;
            }

            .profile-pic {
                margin-right: 0;
                margin-bottom: 20px;
            }

            .posts-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'user_profile' request.user.username %}" class="back-btn">←</a>
        <div class="logo">Instagram</div>
        <div></div>
    </nav>

    <div class="profile-header">
        <div class="profile-info">
            <div class="profile-pic">
                {{ request.user.username|slice:":1"|upper }}
            </div>
            <div class="profile-details">
                <div class="profile-username">Saved</div>
                <div style="font-size: 16px; color: #8e8e8e;">Only you can see what you've saved</div>
            </div>
        </div>
    </div>

    <div class="posts-section">
        <div class="posts-grid">
            {% for post in posts %}
            <div class="post-item">
                {% if post.image %}
                <img src="{{ post.image.url }}" alt="Saved post">
                {% endif %}
            </div>
            {% empty %}
            <div class="no-posts" style="grid-column: 1 / -1;">No saved posts yet.</div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
