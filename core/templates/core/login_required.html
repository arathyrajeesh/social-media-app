<!DOCTYPE html>
<html>
<head>
    <title>Login Required</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            text-align: center;
            padding-top: 100px;
        }
        .box {
            display: inline-block;
            padding: 30px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        a {
            display: inline-block;
            margin-top: 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
        }
        a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Please log in to view profiles</h2>
        <p>You must be logged in to see user profiles and posts.</p>
        <a href="{% url 'login' %}">Go to Login</a>
    </div>
</body>
</html>
