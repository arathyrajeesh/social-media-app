<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #262626;
        }

        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #dbdbdb;
            padding: 0 20px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .logo {
            font-size: 24px;
            font-weight: bold;
            color: #262626;
        }

        .navbar .back-btn {
            font-size: 24px;
            color: #262626;
            text-decoration: none;
        }

        .search-container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-form {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            background-color: #fff;
            font-size: 16px;
            outline: none;
        }

        .search-input::placeholder {
            color: #8e8e8e;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-result {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            text-decoration: none;
            color: inherit;
            transition: background-color 0.2s;
        }

        .user-result:hover {
            background-color: #f8f8f8;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #dbdbdb;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #8e8e8e;
        }

        .user-info {
            flex: 1;
        }

        .username {
            font-weight: 600;
            font-size: 14px;
            color: #262626;
        }

        .follow-btn {
            background-color: #0095f6;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .follow-btn:hover {
            background-color: #007acc;
        }

        .no-results {
            text-align: center;
            color: #8e8e8e;
            font-size: 16px;
            margin-top: 50px;
        }

        .search-prompt {
            text-align: center;
            color: #8e8e8e;
            font-size: 16px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'feed' %}" class="back-btn">←</a>
        <div class="logo">Instagram</div>
        <div></div>
    </nav>

    <div class="search-container">
        <form method="get" class="search-form">
            <input type="text" name="q" class="search-input" placeholder="Search users..." value="{{ query }}" autofocus>
        </form>

        {% if query %}
            {% if results %}
                <div class="results">
                    {% for user in results %}
                    <a href="{% url 'user_profile' user.username %}" class="user-result">
                        <div class="user-avatar">
                            {{ user.username|slice:":1"|upper }}
                        </div>
                        <div class="user-info">
                            <div class="username">{{ user.username }}</div>
                        </div>
                        <a href="{% url 'follow_user' user.username %}"  onclick="event.stopPropagation()"></a>
                    </a>
                    {% endfor %}
                </div>
            {% else %}
                <div class="no-results">No users found for "{{ query }}"</div>
            {% endif %}
        {% else %}
            <div class="search-prompt">Search for users by their username</div>
        {% endif %}
    </div>
</body>
</html>
